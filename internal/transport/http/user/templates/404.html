{{ define "not_found_page" }}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .title }}</title>
  <style>
    :root {
      color-scheme: light;
      --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg-page: #f8fafc;
      --bg-page-accent: #eef6ff;
      --bg-surface: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-inverse: #ffffff;
      --border-subtle: #e2e8f0;
      --primary: #1f4f9f;
      --primary-hover: #183f80;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-md: 8px;
      --radius-xl: 16px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 14px 32px rgba(15, 23, 42, 0.08);
      --control-height: 40px;
      --transition: 160ms ease;
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-primary);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 34vw),
        linear-gradient(180deg, var(--bg-page-accent) 0, var(--bg-page) 280px);
    }

    main {
      display: grid;
      place-items: center;
      min-height: 100vh;
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: var(--space-8) 0;
      box-sizing: border-box;
    }

    .not-found {
      width: min(640px, 100%);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-md);
    }

    .eyebrow {
      margin: 0 0 var(--space-3);
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 var(--space-4);
      color: var(--text-primary);
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      max-width: 560px;
      margin: 0;
      color: var(--text-secondary);
      font-size: 17px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-6);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--control-height);
      padding: 0 var(--space-5);
      border: 1px solid var(--primary);
      border-radius: var(--radius-md);
      color: var(--text-inverse);
      background: var(--primary);
      box-shadow: var(--shadow-sm);
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      transition: background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
    }

    .button:hover,
    .button:focus {
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    .button.secondary {
      border-color: var(--border-subtle);
      color: var(--text-primary);
      background: var(--bg-surface);
    }

    .button.secondary:hover,
    .button.secondary:focus {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--bg-surface);
    }

    @media (max-width: 640px) {
      .not-found {
        padding: var(--space-6);
      }

      .actions {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="not-found" aria-labelledby="not-found-title">
      <p class="eyebrow">404</p>
      <h1 id="not-found-title">Страница не найдена</h1>
      <p>Такого адреса в сервисе нет. Можно войти в аккаунт или сразу перейти к списку задач.</p>
      <div class="actions">
        <a class="button" href="/ui/login">Войти</a>
        <a class="button secondary" href="/ui/tasks">Перейти к задачам</a>
      </div>
    </section>
  </main>
</body>
</html>
{{ end }}
